<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tower of Hanoi">
<title>Tower of Hanoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #E3EBF1;
    --panel: #F6F9FB;
    --ink: #1D2B36;
    --muted: #5B6C7A;
    --line: #C5D3DE;
    --accent: #0E8F8A;
    --accent-ink: #FFFFFF;
    --c-solve: #D6336C; --c-solve-ink: #FFFFFF;
    --c-again: #0E8F8A; --c-again-ink: #FFFFFF;
    --c-lv1: #2E9E5B; --c-lv1-ink: #FFFFFF;
    --c-lv2: #1E88E5; --c-lv2-ink: #FFFFFF;
    --c-lv3: #E0B000; --c-lv3-ink: #1D1500;
    --c-lv4: #D93A3A; --c-lv4-ink: #FFFFFF;
    --c-lv5: #F5A300; --c-lv5-ink: #1D1200;
    --wood: #C9A877;
    --wood-dark: #8A6A41;
    --rod: #BC9A68;
    --tint: rgba(14, 143, 138, .10);
    --ok: #1B7F54;
    --t-green: #1FA55A;
    --t-yellow: #F2B01E;
    --t-red: #E03131;
    --ok-bg: #DDF3E8;
    --bad: #B4321F;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 6px rgba(29, 43, 54, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141F29;
      --panel: #1D2B37;
      --ink: #E8EFF4;
      --muted: #93A5B4;
      --line: #324656;
      --accent: #3FD6CB;
      --accent-ink: #06201E;
      --c-solve: #FF6B9A; --c-solve-ink: #2A0512;
      --c-again: #3FD6CB; --c-again-ink: #06201E;
      --c-lv1: #4BDB88; --c-lv1-ink: #06210F;
      --c-lv2: #5AB0FF; --c-lv2-ink: #04182B;
      --c-lv3: #FFD23F; --c-lv3-ink: #1D1500;
      --c-lv4: #FF6B6B; --c-lv4-ink: #2A0707;
      --c-lv5: #FFB938; --c-lv5-ink: #241500;
      --wood: #C4A272;
      --wood-dark: #7A5C38;
      --rod: #BE9C6C;
      --tint: rgba(63, 214, 203, .14);
      --ok: #6FD6A3;
      --t-green: #34D27B;
      --t-yellow: #FFC83D;
      --t-red: #FF4D4D;
      --ok-bg: #173A2B;
      --bad: #FF8F7C;
      --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141F29;
    --panel: #1D2B37;
    --ink: #E8EFF4;
    --muted: #93A5B4;
    --line: #324656;
    --accent: #3FD6CB;
    --accent-ink: #06201E;
    --c-solve: #FF6B9A; --c-solve-ink: #2A0512;
    --c-again: #3FD6CB; --c-again-ink: #06201E;
    --c-lv1: #4BDB88; --c-lv1-ink: #06210F;
    --c-lv2: #5AB0FF; --c-lv2-ink: #04182B;
    --c-lv3: #FFD23F; --c-lv3-ink: #1D1500;
    --c-lv4: #FF6B6B; --c-lv4-ink: #2A0707;
      --c-lv5: #FFB938; --c-lv5-ink: #241500;
    --wood: #C4A272;
    --wood-dark: #7A5C38;
    --rod: #BE9C6C;
    --tint: rgba(63, 214, 203, .14);
    --ok: #6FD6A3;
    --t-green: #34D27B;
    --t-yellow: #FFC83D;
    --t-red: #FF4D4D;
    --ok-bg: #173A2B;
    --bad: #FF8F7C;
    --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0, 0, 0, .4);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Prompt", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { touch-action: manipulation; }
  .app {
    max-width: 960px; margin: 0 auto;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  }
  .k-s { display: none; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .star-total { min-height: 34px; padding: 3px 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .star-total .st { color: var(--t-yellow); }
  .bn-stars { font-size: clamp(1.8rem, 7vw, 2.4rem); letter-spacing: .08em; line-height: 1.2; margin-top: 2px; }
  .bn-stars .on { color: var(--t-yellow); text-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .bn-stars .off { color: var(--line); }
  .bn-stars:empty, .bn-total:empty { display: none; }
  .bn-total { margin-top: 6px; font-weight: 500; color: var(--ink); font-size: .95rem; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(10, 18, 26, .55); display: flex; align-items: center; justify-content: center; padding: max(8px, env(safe-area-inset-top, 0px)) 8px max(8px, env(safe-area-inset-bottom, 0px)); }
  .modal[hidden] { display: none; }
  .modal-card { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 16px; font-size: 1.05rem; line-height: 1.5; }
  .modal-card h2 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.3; }
  .modal-sum { margin: 4px 0 12px; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }
  .modal-sum b { color: var(--ink); font-size: 1.3rem; }
  .rules { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: 1.02rem; line-height: 1.65; }
  .rules .on { color: var(--t-yellow); }
  .tbl-wrap { overflow-x: auto; }
  .star-tbl { border-collapse: collapse; width: 100%; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .star-tbl th, .star-tbl td { border: 1px solid var(--line); padding: 8px 1px; text-align: center; min-width: 0; }
  .star-tbl th { background: var(--bg); font-weight: 600; color: var(--muted); }
  .star-tbl th.rowh { text-align: left; padding-left: 5px; padding-right: 4px; white-space: nowrap; color: var(--ink); font-size: 1rem; }
  .star-tbl td.v1, .star-tbl td.v2 { color: var(--muted); }
  .star-tbl td.v3, .star-tbl td.v4 { color: var(--ink); font-weight: 700; }
  .star-tbl td.v5 { color: #5a3b00; background: var(--t-yellow); font-weight: 700; }
  .star-tbl td.none { color: var(--line); }
  .modal-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .modal-actions .btn { font-size: 1.05rem; min-height: 46px; padding: 6px 16px; }
  .btn.danger { color: var(--bad); }
  .star-total .rk { font-weight: 500; margin-right: 4px; }
  .bn-rank { margin-top: 6px; font-weight: 700; color: var(--ink); }
  .bn-rank:empty { display: none; }
  .rank-box { margin: 0 0 10px; padding: 10px; border-radius: 10px; background: var(--bg); }
  .rank-now { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
  .rank-bar { margin-top: 6px; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .rank-fill { height: 100%; width: 0; background: var(--t-yellow); border-radius: 999px; transition: width .3s; }
  .rank-next { margin-top: 6px; font-size: 1.05rem; color: var(--muted); line-height: 1.5; }
  .rank-ladder { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .rank-chip { font-size: .98rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .rank-chip.got { color: var(--ink); border-color: var(--t-yellow); background: color-mix(in srgb, var(--t-yellow) 22%, transparent); font-weight: 500; }
  .rank-chip.now { font-weight: 700; border-width: 2px; }
  /* บอกใบ้: แผ่นต้นทางกะพริบ + ลูกศรชี้เสาปลายทาง */
  .disk.hinted { outline: 3px solid var(--t-yellow); outline-offset: 2px; animation: hintblink 1s ease-in-out infinite; }
  @keyframes hintblink { 50% { outline-color: color-mix(in srgb, var(--t-yellow) 25%, transparent); } }
  .hint-arrow {
    position: absolute; left: 50%; z-index: 2;
    bottom: calc(var(--base) + (var(--n) + 1) * var(--dh) + 8px);
    transform: translateX(-50%);
    font-size: clamp(1.3rem, 5vw, 1.8rem); line-height: 1; color: var(--t-yellow);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
    animation: hintbounce .8s ease-in-out infinite; pointer-events: none;
  }
  @keyframes hintbounce { 50% { transform: translateX(-50%) translateY(6px); } }
  .col.hint-to .goal-flag { display: none; }
  .modal-note { margin: 12px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.6; }
  @media (max-height: 540px) { .hint-lbl { display: none; } header .star-total { min-height: 28px; padding: 1px 8px; font-size: .85rem; } }
  header h1 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.6rem); font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  header p { display: none; }

  .controls {
    margin-top: 8px;
    display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
  }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper .lbl { font-weight: 500; font-size: .95rem; }
  .stepper output {
    min-width: 2ch; text-align: center; font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums;
  }
  .settings { flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; }
  .btns {
    flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  button, select {
    font: inherit;
    color: var(--ink);
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 5px 12px;
    min-height: 36px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.round { width: 36px; padding: 0; font-size: 1.3rem; line-height: 1; }
  select.btn { padding-right: 8px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .stats {
    margin-top: 8px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 12px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  .stat .k { font-size: 1rem; line-height: 1.3; color: var(--muted); }
  .stat .v { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .v-sub { margin-left: .4em; font-size: .62em; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .stat .v-sub:empty { display: none; }
  .stat .v-sub::before { content: '⏱ '; }

  .status {
    margin: 8px 2px 0;
    min-height: 1.4em;
    color: var(--muted);
    font-size: 1.05rem; line-height: 1.5;
  }
  .status.bad { color: var(--bad); font-weight: 500; }

  .banner {
    margin-top: 10px;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 500;
  }
  .banner[hidden] { display: none; }
  .banner { text-align: center; padding: 18px 16px 16px; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1); }
  .bn-title { font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 700; line-height: 1.25; }
  .bn-detail { margin-top: 4px; font-weight: 400; color: var(--ink); }
  .bn-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .bn-actions [hidden] { display: none; }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- stage ---------- */
  .stage {
    --dh: 30px;
    --n: 4;
    --base: 16px;
    --headroom: 46px;
    margin-top: 8px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 10px 10px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .col {
    border-radius: 14px;
    cursor: pointer;
    padding: 0 2px 6px;
    transition: background-color .15s;
    outline-offset: -2px;
  }
  @media (hover: hover) { .col:hover { background: var(--tint); } }
  /* เสา C = เป้าหมาย: แกนเสาเขียว + แป้นฐานเขียวเข้ม + ธง + ป้าย "เป้าหมาย" */
  .col.goal {
    --rod: color-mix(in srgb, var(--t-green) 58%, #000);
    --wood: color-mix(in srgb, var(--t-green) 52%, #000);
    --wood-dark: color-mix(in srgb, var(--t-green) 34%, #000);
  }
  .goal-flag {
    position: absolute; left: 50%; z-index: 0;
    bottom: calc(var(--base) + (var(--n) + 1) * var(--dh) + 8px);
    transform: translateX(-50%);
    font-size: clamp(1.2rem, 4.5vw, 1.7rem); line-height: 1;
    animation: flag 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes flag { 50% { transform: translateX(-50%) translateY(-4px) rotate(-6deg); } }
  .goal-pill {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    background: var(--ok); color: var(--ok-bg); font-weight: 700; font-size: .78rem;
  }
  .col.selected { background: var(--tint); box-shadow: 0 0 0 2px var(--accent) inset; }

  .peg {
    position: relative;
    height: calc((var(--n) + 1) * var(--dh) + var(--base) + var(--headroom));
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    padding-bottom: var(--base);
  }
  .peg::before { /* rod: เสาหินทรงกระบอกขัดเงา */
    content: "";
    position: absolute;
    left: 50%; bottom: var(--base);
    width: max(12px, calc(var(--dh) * .36)); transform: translateX(-50%);
    height: calc((var(--n) + 1) * var(--dh) + 10px);
    background:
      linear-gradient(90deg, rgba(255,255,255,0) 14%, rgba(255,255,255,.55) 27%, rgba(255,255,255,0) 40%),
      linear-gradient(90deg, color-mix(in srgb, var(--rod) 45%, #000) 0%, color-mix(in srgb, var(--rod) 78%, #fff) 30%, var(--rod) 58%, color-mix(in srgb, var(--rod) 48%, #000) 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35) inset, 2px 0 5px rgba(0,0,0,.3);
    border-radius: 6px 6px 0 0;
    z-index: 0;
  }
  .peg::after { /* base: แท่นหินขัดเงา */
    content: "";
    position: absolute;
    left: 2%; right: 2%; bottom: 0;
    height: var(--base);
    background:
      linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.2) 46%, rgba(255,255,255,0) 47%),
      linear-gradient(180deg, var(--wood), var(--wood-dark));
    box-shadow: 0 1.5px 0 rgba(255,255,255,.55) inset, 0 -2px 3px rgba(0,0,0,.45) inset, 0 3px 5px rgba(0,0,0,.35);
    border-radius: 8px;
    z-index: 0;
  }

  /* แผ่นหินขัดเงา: ชั้นบนสุดคือแสงสะท้อน, ถัดมาเป็นลายเส้นหิน (อ่อน/เข้ม), ล่างสุดเป็นสีหินไล่เฉด */
  .disk {
    --stone-light: hsl(var(--h) 88% 44%);
    --stone-mid: hsl(var(--h) 92% 30%);
    --stone-dark: hsl(var(--h) 90% 16%);
    --bevel: 0 1.5px 0 hsl(var(--h) 100% 78% / .85) inset,
             0 -3px 5px hsl(var(--h) 90% 8% / .7) inset,
             0 0 0 1px hsl(var(--h) 60% 22% / .55) inset;
    position: relative;
    z-index: 1;
    width: calc(var(--w) * 1%);
    height: calc(var(--dh) - 3px);
    margin-top: 3px;
    border-radius: 999px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 18% 30% at 15% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 40% 30% at 50% 108%, hsl(var(--h) 100% 62% / .55), rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.24) 46%, rgba(255,255,255,0) 47%),
      var(--stone-tex, none) 0 0 / cover,   /* พื้นผิวหินวาดครั้งเดียวตอนโหลดแล้วใช้ซ้ำ (เดิมเป็น SVG feTurbulence 6 ชั้นต่อแผ่น ทำให้หน่วง) */
      linear-gradient(180deg, var(--stone-light) 0%, var(--stone-mid) 52%, var(--stone-dark) 100%);
    box-shadow: var(--bevel), 0 2px 4px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    color: hsl(var(--h) 90% 93%);
    text-shadow: 0 1px 1px hsl(var(--h) 80% 8% / .85), 0 0 4px hsl(var(--h) 80% 10% / .5);
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: .02em;
    transition: transform .16s ease-out;
  }
  /* ตัวเลขในเหรียญหินกลม ฝังอยู่บนแผ่น */
  .disk .num {
    display: grid; place-items: center; flex: none;
    width: min(var(--nd, 22px), 70%); height: auto; aspect-ratio: 1;
    border-radius: 50%;
    line-height: 1; font-variant-numeric: tabular-nums;
    background: radial-gradient(circle at 35% 28%, hsl(var(--h) 75% 34%) 0%, hsl(var(--h) 85% 14%) 78%);
    box-shadow:
      0 0 0 1.2px hsl(var(--h) 90% 80%),
      0 0 0 2px hsl(var(--h) 85% 12% / .7),
      0 1px 3px 1px rgba(0,0,0,.6) inset,
      0 1px 2px rgba(0,0,0,.45);
  }
  .disk.lifted { transform: translateY(-22px); box-shadow: var(--bevel), 0 10px 14px rgba(0,0,0,.35); }
  .disk.drop { animation: drop .28s cubic-bezier(.3, .7, .4, 1); }
  .disk.shake { animation: shake .3s; }
  .disk.cheer { animation: cheer .55s ease-in-out 3; animation-delay: calc(var(--i) * 90ms); }
  .col.win { background: var(--ok-bg); box-shadow: 0 0 0 2px var(--ok) inset; animation: glow 1s ease-in-out 3; }
  @keyframes cheer {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-18px) scale(1.08); }
  }
  @keyframes glow {
    50% { box-shadow: 0 0 0 2px var(--ok) inset, 0 0 26px var(--ok); }
  }
  @keyframes drop {
    from { transform: translateY(-44px); }
    60% { transform: translateY(2px); }
    to { transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { translate: 0 0; }
    25% { translate: -6px 0; }
    75% { translate: 6px 0; }
  }

  .label {
    margin-top: 6px;
    text-align: center;
    font-weight: 700;
    font-size: .95rem;
  }
  .label small { display: block; font-weight: 400; color: var(--muted); font-size: .86rem; min-height: 1.2em; }

  .credit { margin: 16px 0 4px; text-align: center; color: var(--muted); font-size: .8rem; letter-spacing: .02em; }

        } else if (st === 3 && Math.random() < 0.75) {           // ตีซ้ำเบาๆ จังหวะเว้น
          c.n.forEach(function (f, i) { ep(f, tt + i * 0.012, 0.026, len * 3, (i - 1.5) * 0.18); });
        } else if ((st === 1 || st === 5 || st === 7) && Math.random() < 0.22) {   // โน้ตเดี่ยวเบามาก เติมความนุ่ม
          ep(c.n[(Math.random() * c.n.length) | 0] * 2, tt, 0.02, len * 2.4, rnd(-0.3, 0.3));
        }
        if (st === 5 && Math.random() < 0.6) bassNote(c.bass, tt, 0.1, len * 1.6);
        if (DRUMS) {
          if (st === 0 || (st === 5 && Math.random() < 0.7)) kick(tt);
          if (st === 2 || st === 6) noise(tt, 'bandpass', 1900, 0.9, 0.05, 0.11);
          noise(tt, 'bandpass', 5200, 0.8, st % 2 ? 0.009 : 0.014, 0.04);
        }
      }
      return {
        update: function (t, k) {                            // เรียกทุก ~120ms: จองโน้ตล่วงหน้า
          var len = 60 / (75 * k) / 2;                       // ความยาว 1 จังหวะย่อย (เอ็บท์)
          if (!started) { started = true; nextT = t + 0.2; }

        stop: function () { stopped = true; }

    }

    // เสียงพื้นหลัง = ดนตรีผ่อนคลายช้าๆ ใสๆ ไม่มีจังหวะ จึงไม่รบกวนสมาธิตอนวางแผนย้ายแผ่น
    var BPM = { veryeasy: 52, easy: 56, normal: 60, advanced: 64, perfect: 66 };   // ระดับความเร็วเดิม ใช้ปรับความพลิ้วของน้ำเล็กน้อย
    function bpm() { return BPM[level] || 56; }
    function sched() {
      if (!ctx || ctx.state !== 'running' || !stream) return;
      stream.update(ctx.currentTime + 0.05, bpm() / 56);
    }
    function startMusic() {
      if (timer || !ctx) return;
      newSess();
      stream = createMusic(ctx, bus());
      timer = setInterval(sched, 120);
    }
    function stopMusic() {                                // ค่อยๆ จางเสียงน้ำแล้วหยุดแหล่งเสียงทั้งหมด
      if (timer) { clearInterval(timer); timer = null; }
      if (sess && ctx) {
        var o = sess, st = stream, now = ctx.currentTime;
        o.gain.cancelScheduledValues(now); o.gain.setTargetAtTime(0, now, 0.12);
        setTimeout(function () { try { if (st) st.stop(); o.disconnect(); } catch (e) {} }, 1200);
      }
      stream = null; sess = null;
    }
    function applyMusic() {
      if (!ctx) return;
      var now = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setTargetAtTime(musicOn ? MV : 0, now, 0.08);
      if (musicOn) startMusic(); else stopMusic();
    }
    function duck(sec) {                                  // ลดเสียงเพลงชั่วคราวให้ได้ยินเสียงชนะ/แพ้ชัด
      if (!ctx || !musicOn) return;
      var now = ctx.currentTime, g = musicBus.gain;
      g.cancelScheduledValues(now);
      g.setTargetAtTime(MV * 0.3, now, 0.05);
      g.setTargetAtTime(MV, now + sec, 0.4);
    }
    function unlock() { if (ensure() && musicOn) applyMusic(); }   // เบราว์เซอร์ต้องรอให้ผู้เล่นแตะก่อนจึงเปิดเสียงได้
    function save() { try { localStorage.setItem('hanoi-music', musicOn ? 'on' : 'off'); localStorage.setItem('hanoi-sfx', sfxOn ? 'on' : 'off'); } catch (e) {} }

    document.addEventListener('pointerdown', unlock, true);
    document.addEventListener('keydown', unlock, true);
    document.addEventListener('visibilitychange', function () {
      if (!ctx) return;
      try { if (document.hidden) ctx.suspend(); else ctx.resume(); } catch (e) {}
    });

    return {
      play: play, duck: duck,
      music: function () { return musicOn; },
      sfx: function () { return sfxOn; },
      toggleMusic: function () { musicOn = !musicOn; save(); ensure(); applyMusic(); },
      toggleSfx: function () {
        sfxOn = !sfxOn; save(); ensure();

  })();
  function syncAudioUI() {

  function doMove(from, to, auto) {
    hintMove = null;
    captureFlight(from, to);
    var d = pegs[from].pop();
    pegs[to].push(d);
    moves++;
    history.push([from, to]);
    Snd.play('move', reducedMotion() ? 0.03 : flightDuration() / 1000 * 0.9);   // เสียงวางแผ่นตอนแผ่นลงถึงเสา

  function finish(auto) {
    won = true;
    if (started) elapsed = nowMs() - startTime;
    var min = minMoves(), mk, perfect = false, starInfo = null;
    if (auto) {
      mk = function () { return { title: t('win.autoTitle'), detail: t('win.autoDetail', { moves: moves, n: n }) }; };
    } else {
      var bk = starKey(level, n);                       // สถิติแยกตามโหมดความเร็ว + จำนวนแผ่น
      var best = getBest(bk), bestT = getBestTime(bk);
      var fewer = best === null || moves < best;
      var faster = best !== null && moves === best && (bestT === null || elapsed < bestT);   // ย้ายเท่าเดิมแต่เร็วกว่า
      var newRecord = fewer || faster;
      if (newRecord) { setBest(bk, moves); setBestTime(bk, elapsed); }
      perfect = moves === min && hintsUsed === 0;
      var elapsedF = elapsed;
      mk = function () {                                // สร้างข้อความตอนแสดง (เปลี่ยนภาษากลางหน้าสรุปได้)
        var detail = moves === min ? t('win.d1', { moves: moves }) : t('win.d2', { moves: moves, min: min });
        detail += t('win.time', { el: fmtTime(elapsedF), lim: fmtTime(limitMs()), lv: LEVELS[level].name });
        if (newRecord) detail += t('win.record', { n: n, lv: LEVELS[level].name, fewer: fewer });
        return { title: perfect ? t('win.perfect') : t('win.ok'), detail: detail };
      };
      // ดาวของด่านนี้ (โหมดความเร็ว + จำนวนแผ่น): เก็บค่าที่ดีที่สุด
      var totalBefore = totalStars();
      var base = starsFor(moves, min), sv = Math.max(1, base - hintsUsed);   // ใบ้ 1 ครั้ง หัก 1 ดาว (ขั้นต่ำ 1)
      var key = starKey(level, n), prev = stars[key] || 0;
      if (sv > prev) { stars[key] = sv; saveStars(); }
      updateHeader();
      starInfo = { stars: sv, base: base, hints: hintsUsed, prev: prev, gained: Math.max(0, sv - prev), total: totalStars(), nextMax: sv < 5 ? starLimits(min)[4 - sv] : 0,
        rankUp: rankIndex(totalStars()) > rankIndex(totalBefore) ? RANKS[rankIndex(totalStars())] : null };
    }
    // เก็บผลไว้ก่อน แล้วค่อยแสดงหลังจากแผ่นสุดท้ายวางเสร็จ (ดู render)
    winInfo = { mk: mk, auto: !!auto, perfect: perfect, star: starInfo };
    winPending = true;
    setStatus('');
  }

  function updateHeader() {

    else if (si.stars < 5) tx += I18N_t('bn.next', { s: si.stars, max: si.nextMax });

  function showBanner() {

  function timeUp(wrong) {
    over = true;
    failReason = wrong ? 'wrong' : 'time';
    lastWrong = wrong || null;
    if (wrong && started) elapsed = nowMs() - startTime;   // หยุดเวลา ณ ตอนย้ายผิด
    selected = null;
    winToken++;
    if (!wrong) {                                      // ย้ายผิดในโหมดผึ้งพิเศษ ไม่นับเป็นการล้มเหลวเพื่อปลดล็อกเฉลย (กันกดผิดรัวๆ เพื่อดูเฉลย)
      failsMap[starKey(level, n)] = Math.min(curFails() + 1, 99);
      savePrefs();
    }
    var fails = curFails(), unlocked = fails >= UNLOCK_FAILS;

  function stopConfetti() {
    if (!confetti) return;
    cancelAnimationFrame(confetti.raf);

    if (confetti.cv.parentNode) confetti.cv.parentNode.removeChild(confetti.cv);
    confetti = null;
  }
  function launchConfetti() {
    stopConfetti();
    var cv = document.createElement('canvas');
    cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';
    document.body.appendChild(cv);
    var dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    var parts = [];
    var scale = Math.max(0.7, Math.min(1.3, H / 800));

    function spawn(x, y, count, aMin, aMax, vMin, vMax) {
      for (var i = 0; i < count; i++) {
        var a = (aMin + Math.random() * (aMax - aMin)) * Math.PI / 180;
        var v = (vMin + Math.random() * (vMax - vMin)) * scale;
        parts.push({
          x: x, y: y,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
          rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
          wob: Math.random() * 6.28,
          hue: Math.floor(Math.random() * 360),
          round: Math.random() < .25
        });
      }
    }
    // ปืนใหญ่ซ้าย-ขวาจากขอบล่าง
    spawn(W * 0.08, H, 70, -80, -50, 14, 28);
    spawn(W * 0.92, H, 70, -130, -100, 14, 28);
    var st = { cv: cv, raf: 0, t: 0 };
    confetti = st;
    st.t = setTimeout(function () {
      // รอบสองระเบิดกลางจอ
      spawn(W * 0.5, H * 0.35, 90, 0, 360, 4, 14);
    }, 450);

    var last = performance.now(), t0 = last;
    function frame(now) {
      var dt = Math.min(3, (now - last) / 16.67);
      last = now;
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      for (var i = 0; i < parts.length; i++) {
        var q = parts[i];
        q.vy += 0.38 * dt * scale;
        q.vx *= Math.pow(0.992, dt);
        q.vy *= Math.pow(0.992, dt);
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.rot += q.vr * dt;
        q.wob += 0.18 * dt;
        if (q.y < H + 30) alive++;
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.rotate(q.rot);
        ctx.scale(1, Math.cos(q.wob));
        ctx.fillStyle = 'hsl(' + q.hue + ' 85% 58%)';
        if (q.round) { ctx.beginPath(); ctx.arc(0, 0, q.w / 2.2, 0, 6.283); ctx.fill(); }
        else ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
        ctx.restore();
      }
      if (now - t0 > 6000 || (alive === 0 && now - t0 > 900)) { stopConfetti(); return; }
      st.raf = requestAnimationFrame(frame);
    }
    st.raf = requestAnimationFrame(frame);
  }

  function select(i) {
    if (solving || won || over) return;
    if (i === 0) startClock();            // เริ่มนับเวลาเมื่อคลิกเสา A ครั้งแรก
    if (selected === null) {
      if (!pegs[i].length) { Snd.play('bad'); setStatus(t('st.noDisk', { peg: NAMES[i] }), true); return; }
      selected = i;
      Snd.play('pick');
      setStatus(t('st.picked', { d: pegs[i][pegs[i].length - 1], peg: NAMES[i] }));
      render();
      return;
    }
    if (selected === i) {
      selected = null;
      Snd.play('cancel');
      setStatus(t('st.putBack'));
      render();
      return;
    }
    if (!canMove(selected, i)) {
      shakePeg = selected;
      Snd.play('bad');
      setStatus(t('st.tooBig'), true);
      render();
      return;
    }
    var from = selected;
    if (strictMode()) {                                // โหมดผึ้งพิเศษ: ต้องตรงกับท่าที่ดีที่สุดถัดไปเท่านั้น
      var bm = nextBestMove();
      if (!bm || bm[0] !== from || bm[1] !== i) {
        var wd = pegs[from][pegs[from].length - 1];
        timeUp({ from: from, to: i, disk: wd, exp: bm, expDisk: bm ? pegs[bm[0]][pegs[bm[0]].length - 1] : null });
        return;
      }
    }
    doMove(from, i, false);
    if (!won) setStatus(t('st.moved', { from: NAMES[from], to: NAMES[i] }));
    render();
  }

  function useHint() {
    if (solving || won || over) return;
    if (!hintMove) {                                   // ใบ้ซ้ำในสถานะเดิมไม่เสียโควตาเพิ่ม
      if (hintsLeft <= 0) {
        setStatus(hintBalance() <= 0
          ? t('st.hintNoBal')
          : t('st.hintNoLeft', { per: HINT_PER_ROUND, n: Math.min(HINT_PER_ROUND, hintBalance()) }), true);
        return;
      }
      var mv = nextBestMove();
      if (!mv) return;
      hintsLeft--; hintsUsed++; roundTouched = true;
      hintMove = mv; selected = null;
    }
    Snd.play('hint');
    var top = pegs[hintMove[0]][pegs[hintMove[0]].length - 1];
    setStatus(t('st.hint', { d: top, from: NAMES[hintMove[0]], to: NAMES[hintMove[1]], left: hintsLeft, per: HINT_PER_ROUND, used: hintsUsed }));
    render();
  }
  function undo() {
    if (solving || over || won || !history.length || strictMode()) return;   // ผึ้งพิเศษ: ไม่มีย้อนกลับ (ย้ายผิดตกทันที)
    hintMove = null;
    var m = history.pop();
    captureFlight(m[1], m[0]);
    var d = pegs[m[1]].pop();
    pegs[m[0]].push(d);
    moves++;                              // การย้อนกลับนับเป็นการขยับ 1 ครั้งด้วย
    won = false; resetCelebration(); selected = null; lastDrop = null;
    Snd.play('undo');
    setStatus(t('st.undo'));
    render();
  }

  /* ---------- auto solve ---------- */
  function buildSolution(k, a, b, c, out) {
    if (k === 0) return;
    buildSolution(k - 1, a, c, b, out);
    out.push([a, b]);
    buildSolution(k - 1, c, b, a, out);
  }
  function startSolve() {
    if (curFails() < UNLOCK_FAILS) return;   // ด่านที่ปลดล็อกแล้วปลดถาวร (ล้างได้ด้วยปุ่มรีเซ็ตสถิติ)
    init(undefined, true);                   // ดูเฉลยไม่หักแต้มใบ้
    solving = true;
    solveList = []; buildSolution(n, 0, 2, 1, solveList);
    solveIdx = 0;
    setStatus(t('st.solving', { n: n, m: solveList.length }));
    runSolveTimer();
    render();
  }
  function runSolveTimer() {
    clearInterval(solveTimer);

  }
  function stepSolve() {
    if (solveIdx >= solveList.length) { stopSolve(); updateButtons(); return; }
    var m = solveList[solveIdx++];
    doMove(m[0], m[1], true);
    render();
    // อย่าเรนเดอร์ซ้ำหลังย้ายครั้งสุดท้าย เพราะจะตัดแอนิเมชันที่กำลังเล่นอยู่
    if (won) { stopSolve(); updateButtons(); }
  }
  function stopSolve() {
    clearInterval(solveTimer);
    solveTimer = null;
    solving = false;
  }

  /* ---------- render ---------- */
  function render() {

        var d = document.createElement('div');

  function bakeStone() {

  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (diskHeight() !== lastDh) render(); }, 150);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);


  /* ---------- ภาษา: ใส่ข้อความตามภาษาที่เลือก ---------- */
  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t('doc.title');
    for (var lv in LEVELS) LEVELS[lv].name = LEVELS[lv].icon + ' ' + t('lv.' + lv);
    RANKS.forEach(function (r, i) { r.name = t('rank.' + i); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-html]'), function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-attr]'), function (el) {
      el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
        var kv = pair.split(':'); el.setAttribute(kv[0], t(kv[1]));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.lv'), function (b) {
      var k = b.dataset.lv, nm = t('lv.' + k);
      b.querySelector('.lv-n').textContent = ' ' + nm;
      b.setAttribute('aria-label', k === 'perfect' ? t('aria.perfect') : nm);
      b.title = k === 'perfect' ? t('title.perfect') : nm;
    });
    var lb = $('#langBtn');
    lb.textContent = LANG === 'th' ? 'EN' : 'TH';
    lb.setAttribute('aria-label', t('title.lang')); lb.title = t('title.lang');
  }
  function refreshLang() {                              // เรียกหลังเปลี่ยนภาษากลางเกม: อัปเดตข้อความที่สร้างจากโค้ด
    applyStatic();
    syncAudioUI();
    updateHeader();
    renderStarModal();
    $('#startLbl').textContent = startLabel();
    if (!won && !over && !solving && !started && moves === 0) setStatus(idleStatus());
    if (!banner.hidden) {
      if (banner.classList.contains('fail')) fillFailBanner();
      else if (won && winInfo) fillWinBanner(winInfo);
    }
    render();
  }
  function setLang(l) {
    if (l !== 'th' && l !== 'en') return;
    LANG = l;
    try { localStorage.setItem('hanoi-lang', l); } catch (e) {}
    refreshLang();
  }
  $('#langBtn').addEventListener('click', function () { setLang(LANG === 'th' ? 'en' : 'th'); });

  applyStatic();
  loadPrefs();
  loadStars();
  migrateBest();
  playN = n;                               // ด่านจริง: 2 แผ่น (ผู้เล่นใหม่) หรือด่านที่ค้างไว้
  previewing = true; previewCall = true;
  init(PREVIEW_N);                         // หน้าแรกโชว์ 5 แผ่นให้ดูสวย
  previewCall = false;
  $('#startLbl').textContent = startLabel();   // เคยเล่นแล้ว (หรือมีดาวสะสม) = "เล่นต่อ"
})();
</script>
</body>
</html>
